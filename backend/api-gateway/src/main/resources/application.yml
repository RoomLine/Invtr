server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/\*\*]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:
        # 1. Route for your Auth Service
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: equipment-service
          uri: http://localhost:8082
          predicates:
           - Path=/equipment/**

        - id: request-service
          uri: http://localhost:8083
          predicates:
           - Path=/requests/**,

        - id: reports-service
          uri: http://localhost:8084
          predicates:
            - Path=/reports/**