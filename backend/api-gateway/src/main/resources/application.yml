server:
  port: 8080 # The Master Port the frontend will use

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # 1. Route for your Auth Service
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        # 2. Route for your Teammate's Equipment Service
        - id: equipment-service
          uri: http://localhost:8082
          predicates:
            - Path=/equipment/**

        # 3. Route for your Teammate's Request & Reports Service
        - id: request-service
          uri: http://localhost:8083
          predicates:
            - Path=/request/**, /requests/**, /manager/**, /reports/**